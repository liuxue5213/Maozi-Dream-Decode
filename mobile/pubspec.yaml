name: dream_decode
description: 梦语 - 梦境记录与 AI 解析

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 网络请求
  dio: ^5.4.3+1

  # 本地存储
  shared_preferences: ^2.2.3

  # 路由
  go_router: ^14.2.0

  # 工具
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0

  # Markdown渲染（AI解析结果）
  flutter_markdown: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - .env
