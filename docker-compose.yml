version: '3.8'

services:
  # PostgreSQL 数据库
  db:
    image: postgres:16-alpine
    container_name: dream-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dream2024}
      POSTGRES_DB: dream_app
    volumes:
      - dream-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI 后端 + Web 前端
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dream-api
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-dream2024}@db:5432/dream_app
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-random-secret-key}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_MODEL: qwen-plus
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    ports:
      - "60185:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "python scripts/seed_encyclopedia.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Nginx 反向代理（可选，用于生产环境）
  nginx:
    image: nginx:alpine
    container_name: dream-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "60180:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dream-db-data:
