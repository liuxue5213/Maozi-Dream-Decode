name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter 3.19.6 (Stable)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'
        channel: 'stable'
        cache: true
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Complete Flutter Project Structure
      run: |
        echo "🔧 完整重建Flutter项目结构..."
        
        # 备份现有的重要文件
        cd mobile
        mkdir -p ../mobile_backup
        cp -r lib ../mobile_backup/ || true
        cp pubspec.yaml ../mobile_backup/ || true
        cp .gitignore ../mobile_backup/ || true
        cp .env.example ../mobile_backup/ || true
        
        # 移动到上级目录
        cd ..
        
        # 删除现有的不完整mobile目录
        rm -rf mobile
        
        # 重新创建完整的Flutter项目
        flutter create --org com.maozi.dreamdecode --project-name maozi_dream_decode --platforms android,ios mobile
        
        # 恢复重要文件
        cp -r mobile_backup/lib/* mobile/lib/ || true
        cp mobile_backup/pubspec.yaml mobile/pubspec.yaml || true
        cp mobile_backup/.gitignore mobile/.gitignore || true
        cp mobile_backup/.env.example mobile/.env.example || true
        
        # 清理备份
        rm -rf mobile_backup
        
        echo "✅ Flutter项目重建完成"
        
    - name: Downgrade shared_preferences to Compatible Version
      run: |
        cd mobile
        
        # 修改pubspec.yaml，使用兼容的shared_preferences版本
        sed -i 's/shared_preferences: ^2.4.7/shared_preferences: ^2.3.0/' mobile/pubspec.yaml || true
        
        echo "✅ shared_preferences降级到2.3.0（与Flutter 3.19.6兼容）"
        
    - name: Create Production Environment File
      run: |
        cd mobile
        
        # 创建生产环境配置文件
        echo "API_BASE_URL=${{ secrets.API_BASE_URL != '' && secrets.API_BASE_URL || 'http://your-server-ip:60185' }}" > .env
        echo "APP_NAME=帽子解梦" >> .env  
        echo "APP_VERSION=1.0.0" >> .env
        
        echo "✅ 生产环境配置文件已创建"
        echo "📡 API地址: $(grep API_BASE_URL .env)"
        
    - name: Update App Configuration
      run: |
        cd mobile
        
        # 更新应用名称
        if [ -f "android/app/src/main/res/values/strings.xml" ]; then
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">帽子解梦<\/string>/g' android/app/src/main/res/values/strings.xml
        fi
        
        echo "✅ 应用配置更新完成"
        
    - name: Install Flutter dependencies
      run: |
        cd mobile
        flutter pub get
        
    - name: Build Android APK
      run: |
        cd mobile
        flutter build apk --release
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: maozi-dream-decode-apk
        path: mobile/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
        
    - name: Release Summary
      run: |
        echo "# 🎉 Android APK 构建成功！" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 📦 构建信息" >> $GITHUB_STEP_SUMMARY
        echo "- **应用名称**: 帽子解梦" >> $GITHUB_STEP_SUMMARY
        echo "- **包名**: com.maozi.dreamdecode" >> $GITHUB_STEP_SUMMARY
        echo "- **版本**: 1.0.0" >> $GITHUB_STEP_SUMMARY
        echo "- **Flutter版本**: 3.19.6" >> $GITHUB_STEP_SUMMARY
        echo "- **shared_preferences**: 2.3.0（兼容版本）" >> $GITHUB_STEP_SUMMARY
        echo "- **构建时间**: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 🔧 关键修复" >> $GITHUB_STEP_SUMMARY
        echo "- 使用更稳定的Flutter 3.19.6版本" >> $GITHUB_STEP_SUMMARY
        echo "- 降级shared_preferences到2.3.0（兼容版本）" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## ⚠️ 重要配置提醒" >> $GITHUB_STEP_SUMMARY
        echo "### 🌐 后端API配置" >> $GITHUB_STEP_SUMMARY
        echo "- **GitHub Secret**: \`API_BASE_URL\`" >> $GITHUB_STEP_SUMMARY
        echo "- **默认值**: \`http://your-server-ip:60185\`" >> $GITHUB_STEP_SUMMARY
        echo "- **说明**: 请在仓库 Settings → Secrets 中配置真实的服务器地址" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 📥 下载方式" >> $GITHUB_STEP_SUMMARY
        echo "1. 前往 Actions 页面的 'Artifacts' 部分" >> $GITHUB_STEP_SUMMARY
        echo "2. 下载 \`maozi-dream-decode-apk\` 文件" >> $GITHUB_STEP_SUMMARY