name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'
        channel: 'stable'
        cache: true
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Complete Flutter Project Structure
      run: |
        echo "Rebuilding Flutter project structure..."
        
        cd mobile
        mkdir -p ../mobile_backup
        cp -r lib ../mobile_backup/ || true
        cp pubspec.yaml ../mobile_backup/ || true
        cp .gitignore ../mobile_backup/ || true
        cp .env.example ../mobile_backup/ || true
        
        cd ..
        rm -rf mobile
        
        flutter create --org com.maozi.dreamdecode --project-name dream_decode --platforms android mobile
        
        cp -r mobile_backup/lib mobile/
        cp mobile_backup/pubspec.yaml mobile/pubspec.yaml
        cp mobile_backup/.gitignore mobile/.gitignore || true
        cp mobile_backup/.env.example mobile/.env.example || true
        
        rm -rf mobile_backup
        echo "Flutter project rebuilt"
        
    - name: Generate App Icons
      run: |
        pip install Pillow
        python3 scripts/generate_icons.py
        echo "App icons generated"
        
    - name: Configure App Name and Environment
      run: |
        cd mobile
        
        sed -i 's/android:label="[^"]*"/android:label="帽子解梦"/' android/app/src/main/AndroidManifest.xml
        
        # 允许明文HTTP（连接局域网 http://IP:60185 必需）
        sed -i 's|<application|<application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
        
        # 确保Release包含INTERNET权限（Flutter模板默认只在debug/profile有）
        grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
        
        mkdir -p android/app/src/main/res/values
        cat > android/app/src/main/res/values/strings.xml << 'XMLEOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">帽子解梦</string>
        </resources>
        XMLEOF
        
        echo "API_BASE_URL=${{ secrets.API_BASE_URL != '' && secrets.API_BASE_URL || 'http://your-server-ip:60185' }}" > .env
        echo "APP_NAME=帽子解梦" >> .env  
        echo "APP_VERSION=1.0.0" >> .env
        
        echo "App name set to: 帽子解梦"
        
    - name: Install Flutter dependencies
      run: |
        cd mobile
        flutter pub get
        
    - name: Build Android APK
      run: |
        cd mobile
        flutter build apk --release
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: maozi-dream-decode-apk
        path: mobile/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
        
    - name: Release Summary
      run: |
        echo "# APK Build Success" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Build Info" >> $GITHUB_STEP_SUMMARY
        echo "- **App Name**: 帽子解梦" >> $GITHUB_STEP_SUMMARY
        echo "- **Package**: com.maozi.dreamdecode" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: 1.0.0" >> $GITHUB_STEP_SUMMARY
        echo "- **Flutter**: 3.19.6" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Time**: $(date)" >> $GITHUB_STEP_SUMMARY
