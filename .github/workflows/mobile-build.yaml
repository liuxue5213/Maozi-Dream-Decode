name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'
        channel: 'stable'
        cache: true
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Complete Flutter Project Structure
      run: |
        echo "🔧 完整重建Flutter项目结构..."
        
        # 备份现有的重要文件
        cd mobile
        mkdir -p ../mobile_backup
        cp -r lib ../mobile_backup/ || true
        cp pubspec.yaml ../mobile_backup/ || true
        cp .gitignore ../mobile_backup/ || true
        cp .env.example ../mobile_backup/ || true
        
        # 移动到上级目录
        cd ..
        
        # 删除现有的不完整mobile目录
        rm -rf mobile
        
        # 重新创建完整的Flutter项目
        flutter create --org com.maozi.dreamdecode --project-name dream_decode --platforms android mobile
        
        # 恢复重要文件
        cp -r mobile_backup/lib mobile/
        cp mobile_backup/pubspec.yaml mobile/pubspec.yaml
        cp mobile_backup/.gitignore mobile/.gitignore || true
        cp mobile_backup/.env.example mobile/.env.example || true
        
        # 清理备份
        rm -rf mobile_backup
        
        echo "✅ Flutter项目重建完成"
        
    - name: Setup Python for icon generation
      uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
    - name: Generate App Icons
      run: |
        cd mobile
        pip install Pillow
        
        # 使用仓库中保存的图标生成各尺寸
        python3 - <<'PYEOF'
        import os
        from PIL import Image
        import glob
        
        # 查找图标文件（在仓库的covers目录中）
        icon_files = glob.glob("../covers/dream_icon_*.png")
        if not icon_files:
            icon_files = glob.glob("../covers/帽子解梦_mysterious_*.png")
        
        if icon_files:
            source = icon_files[0]
            print(f"使用图标: {source}")
            
            img = Image.open(source)
            if img.mode != 'RGBA':
                img = img.convert('RGBA')
            
            # 裁剪为正方形
            min_dim = min(img.size)
            left = (img.size[0] - min_dim) // 2
            top = (img.size[1] - min_dim) // 2
            img = img.crop((left, top, left + min_dim, top + min_dim))
            
            # 生成各尺寸
            sizes = {
                "mipmap-mdpi": 48,
                "mipmap-hdpi": 72,
                "mipmap-xhdpi": 96,
                "mipmap-xxhdpi": 144,
                "mipmap-xxxhdpi": 192
            }
            
            for density, size in sizes.items():
                os.makedirs(f"android/app/src/main/res/{density}", exist_ok=True)
                img.resize((size, size), Image.Resampling.LANCZOS).save(
                    f"android/app/src/main/res/{density}/ic_launcher.png", "PNG"
                )
                print(f"  ✅ {density} ({size}x{size})")
        else:
            print("⚠️ 未找到图标文件，使用默认图标")
        PYEOF
        
        echo "✅ 应用图标生成完成"
        
    - name: Configure App Name and Environment
      run: |
        cd mobile
        
        # 更新AndroidManifest.xml中的应用名称
        sed -i 's/android:label="[^"]*"/android:label="帽子解梦"/' android/app/src/main/AndroidManifest.xml
        
        # 创建strings.xml（如果不存在）
        mkdir -p android/app/src/main/res/values
        cat > android/app/src/main/res/values/strings.xml << 'XMLEOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">帽子解梦</string>
        </resources>
        XMLEOF
        
        # 创建生产环境配置文件
        echo "API_BASE_URL=${{ secrets.API_BASE_URL != '' && secrets.API_BASE_URL || 'http://your-server-ip:60185' }}" > .env
        echo "APP_NAME=帽子解梦" >> .env  
        echo "APP_VERSION=1.0.0" >> .env
        
        echo "✅ 应用名称已设置为：帽子解梦"
        echo "✅ API地址: $(grep API_BASE_URL .env)"
        
    - name: Install Flutter dependencies
      run: |
        cd mobile
        flutter pub get
        
    - name: Build Android APK
      run: |
        cd mobile
        flutter build apk --release
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: maozi-dream-decode-apk
        path: mobile/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
        
    - name: Release Summary
      run: |
        echo "# 🎉 帽子解梦 APK 构建成功！" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 📦 构建信息" >> $GITHUB_STEP_SUMMARY
        echo "- **应用名称**: 帽子解梦" >> $GITHUB_STEP_SUMMARY
        echo "- **包名**: com.maozi.dreamdecode" >> $GITHUB_STEP_SUMMARY
        echo "- **版本**: 1.0.0" >> $GITHUB_STEP_SUMMARY
        echo "- **Flutter版本**: 3.19.6" >> $GITHUB_STEP_SUMMARY
        echo "- **图标**: 解梦主题（月亮星星）" >> $GITHUB_STEP_SUMMARY
        echo "- **构建时间**: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## ✨ 本次更新" >> $GITHUB_STEP_SUMMARY
        echo "- 梦境保存支持本地存储（后端不可用也能保存）" >> $GITHUB_STEP_SUMMARY
        echo "- 解梦百科内置30个词条数据" >> $GITHUB_STEP_SUMMARY
        echo "- 个人中心页面（统计、设置、退出登录）" >> $GITHUB_STEP_SUMMARY
        echo "- 全新解梦主题应用图标" >> $GITHUB_STEP_SUMMARY
__zcode_status=$?
if [ "$__zcode_status" -eq 0 ]; then pwd -P > '/var/folders/ty/0xm9rt3x3hj7zjy16lgdqr_40000gp/T/zcode-e664f600-bd3d-48e9-9447-fccf5f857875-cwd'; fi
exit "$__zcode_status"