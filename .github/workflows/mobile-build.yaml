name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        cache: true
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Regenerate Flutter Android Project
      run: |
        cd mobile
        echo "🔧 重新生成标准Flutter Android项目..."
        
        # 检查是否有android目录
        if [ ! -d "android" ]; then
          echo "📱 Android目录不存在，重新生成..."
          # 备份现有的lib目录
          mv lib lib_backup || true
          
          # 使用Flutter重新生成标准项目结构
          flutter create --org com.maozi.dreamdecode --project-name maozi_dream_decode .
          
          # 恢复lib目录（保留原有的Dart代码）
          rm -rf lib
          mv lib_backup lib || true
          
          echo "✅ Flutter Android项目重新生成完成"
        else
          echo "✅ Android目录已存在"
        fi
        
    - name: Update App Name and Config
      run: |
        cd mobile
        # 更新应用名称为中文
        if [ -f "android/app/src/main/res/values/strings.xml" ]; then
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">帽子解梦<\/string>/g' android/app/src/main/res/values/strings.xml
          echo "✅ 应用名称已更新为'帽子解梦'"
        fi
        
        # 创建.env文件
        echo "API_BASE_URL=https://api.maozi-dream-decode.com" > .env
        echo "APP_NAME=帽子解梦" >> .env  
        echo "APP_VERSION=1.0.0" >> .env
        
    - name: Install Flutter dependencies
      run: |
        cd mobile
        flutter pub get
        
    - name: Build Android APK
      run: |
        cd mobile
        flutter build apk --release
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: maozi-dream-decode-apk
        path: mobile/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
        
    - name: Release Summary
      run: |
        echo "# 🎉 Android APK 构建成功！" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 📦 构建信息" >> $GITHUB_STEP_SUMMARY
        echo "- **应用名称**: 帽子解梦" >> $GITHUB_STEP_SUMMARY
        echo "- **包名**: com.maozi.dreamdecode" >> $GITHUB_STEP_SUMMARY
        echo "- **版本**: 1.0.0" >> $GITHUB_STEP_SUMMARY
        echo "- **构建时间**: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 📥 下载方式" >> $GITHUB_STEP_SUMMARY
        echo "1. 前往 Actions 页面的 'Artifacts' 部分" >> $GITHUB_STEP_SUMMARY
        echo "2. 下载 `maozi-dream-decode-apk` 文件" >> $GITHUB_STEP_SUMMARY